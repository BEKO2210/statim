# Statim TLS reverse proxy. Include from the http context, after
# deploy/nginx/statim-zones.conf (the zones and the statim_noauth format).
#
# Minimum nginx: 1.25.1. `http2 on;` replaces the deprecated
# `listen ... http2` parameter (ngx_http_v2_module).

upstream statim {
    server 127.0.0.1:8080;
    keepalive 16;
}

server {
    listen 80 default_server;
    server_name statim.example.com;
    access_log /var/log/nginx/access.log statim_noauth;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl default_server;
    http2 on;
    server_name statim.example.com;

    # Replace both paths with the real chain and key (full chain, then the leaf).
    ssl_certificate     /etc/letsencrypt/live/statim.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/statim.example.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    # Mozilla intermediate profile, guidelines 5.7, OpenSSL cipher names:
    # https://ssl-config.mozilla.org/guidelines/5.7.json
    # (configurations.intermediate.ciphers.openssl). server_preferred_order
    # is false there, so the server does not reorder the client's ciphers.
    # DHE uses nginx's built-in 2048-bit FFDHE parameters (dh_param_size 2048
    # in that profile); no ssl_dhparam file.
    ssl_ciphers "ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384:DHE-RSA-CHACHA20-POLY1305";
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:statim_ssl:10m;
    ssl_session_tickets off;

    # On every status, including 403 and 413 generated here.
    # No Content-Security-Policy. src/playground.html is one document: inline
    # style, an inline script, and data: fonts and favicon. A policy on the
    # proxy would break GET / . The server sends its own, hash-pinned
    # CSP for the playground (#81).
    add_header Strict-Transport-Security "max-age=63072000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "DENY" always;
    # Statim sends these three itself (and its own Content-Security-Policy on the playground, which
    # is passed through); hide its copies so each header reaches the client exactly once.
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header Referrer-Policy;
    proxy_hide_header X-Frame-Options;

    # include/statim/security.h: max_body_bytes = 2 * 1024 * 1024.
    # nginx "m" is 1024*1024, so 2m is that default and not a byte more.
    client_max_body_size 2m;

    limit_req zone=statim_rate burst=20 nodelay;
    limit_conn statim_conn 20;

    access_log /var/log/nginx/access.log statim_noauth;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Request-ID $request_id;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    # $scheme is https on this server. Authorization is not set here, so the
    # client header is forwarded unchanged, and statim_noauth does not log it.
    proxy_set_header X-Forwarded-Proto $scheme;
    # An empty Connection header is what lets `keepalive 16` reuse the upstream
    # connection. The default Connection: close would disable the pool.
    proxy_set_header Connection "";

    # TCP connect to loopback. Five seconds fails the request when Statim is
    # not listening, instead of holding the client open.
    proxy_connect_timeout 5s;
    # Time between two writes of the request to Statim. server.h
    # request_timeout is 30s (the absolute header and body read deadline).
    # 35s lets that deadline answer before nginx gives up mid-body.
    proxy_send_timeout 35s;
    # Time between two reads of Statim's response. server.h inference_timeout
    # is 120s and includes queue wait. 125s is that budget plus a few seconds
    # to write the JSON, so nginx does not cut a request Statim may still finish.
    proxy_read_timeout 125s;
    # A decision, /health and /metrics are one small JSON body, not a stream.
    # Buffering stays on so nginx can store that body and return the keepalive
    # connection to the pool instead of pinning it until the client finishes reading.
    proxy_buffering on;

    # /metrics is operator data (bearer-protected as well). 127.0.0.1 covers a
    # Prometheus process on this host. To scrape from another machine, name it
    # before deny all, for example:
    #   allow 10.0.0.5;  # prometheus.internal
    #   deny all;
    location = /metrics {
        allow 127.0.0.1;
        deny all;
        proxy_pass http://statim;
    }

    # /health and /ready are public probes and stay on this prefix.
    location / {
        proxy_pass http://statim;
    }
}
