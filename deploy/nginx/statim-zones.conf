# Include this file from the http context, before deploy/nginx/statim.conf.
# limit_req_zone, limit_conn_zone and log_format are valid only there.
# With the stock nginx.conf, `include /etc/nginx/conf.d/*.conf;` does that:
# statim-zones.conf sorts before statim.conf.

# 10 MiB holds about 160 000 IPv4 addresses. 10 r/s per client, burst 20
# in statim.conf. Application admission is not a denial-of-service boundary
# (docs/THREAT_MODEL.md).
limit_req_zone $binary_remote_addr zone=statim_rate:10m rate=10r/s;
limit_conn_zone $binary_remote_addr zone=statim_conn:10m;

# Combined-style line plus the nginx request id. Deliberately no
# $http_authorization: the proxy forwards Authorization to Statim and must
# not write bearer tokens to the access log.
log_format statim_noauth '$remote_addr - $remote_user [$time_local] '
                         '"$request" $status $body_bytes_sent '
                         '"$http_referer" "$http_user_agent" '
                         'rid=$request_id';
