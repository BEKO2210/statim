<svg xmlns="http://www.w3.org/2000/svg" width="960" height="904" viewBox="0 0 960 904" role="img" aria-labelledby="results-0.5.0-dark-title results-0.5.0-dark-desc"><title id="results-0.5.0-dark-title">Statim 0.5.0: licence-clean model vs. base checkpoint</title><desc id="results-0.5.0-dark-desc">Accuracy of the base checkpoint and the Statim 0.5.0 model on Banking77 intents: 0.550 to 0.928; MASSIVE intents: 0.533 to 0.867; Typed decisions: 0.361 to 0.768; GoEmotions: 0.487 to 0.527; SIB-200 topic: 0.727 to 0.713; HateCheck: 0.767 to 0.780; Sentiment: 0.620 to 0.673; AG News: 0.943 to 0.939; DAIR Emotion: 0.595 to 0.588; SemRel: 0.260 to 0.313; Belebele: 0.380 to 0.453; HWU64 intents: 0.607 to 0.833.</desc><rect x="0" y="0" width="960" height="904" rx="16" fill="#12151B"/><g aria-hidden="true"><path d="M41 44H50.5" stroke="#E7EAEF" stroke-width="2.5" stroke-linecap="round"/><circle cx="57" cy="36" r="2.2" fill="none" stroke="#8A93A1" stroke-width="1.25"/><circle cx="57" cy="44" r="4" fill="#34D399"/><circle cx="57" cy="52" r="2.2" fill="none" stroke="#8A93A1" stroke-width="1.25"/></g><text x="73" y="48.5" font-family="Inter, 'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="500" fill="#C2C8D1">Release 0.5.0</text><text x="40" y="88" font-family="Inter, 'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="600" fill="#E7EAEF">Better on every trained task, no significant loss where it never trained</text><text x="40" y="114" font-family="Inter, 'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#C2C8D1">Held-out test rows and zero-shot suites, seeded samples; the model never saw these rows.</text><path d="M300.0 162V830" stroke="#2B323D" stroke-width="1"/><text x="300" y="156" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="12" text-anchor="middle" fill="#8A93A1">0</text><path d="M430.0 162V830" stroke="#2B323D" stroke-width="1"/><text x="430.0" y="156" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="12" text-anchor="middle" fill="#8A93A1">0.25</text><path d="M560.0 162V830" stroke="#2B323D" stroke-width="1"/><text x="560.0" y="156" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="12" text-anchor="middle" fill="#8A93A1">0.5</text><path d="M690.0 162V830" stroke="#2B323D" stroke-width="1"/><text x="690.0" y="156" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="12" text-anchor="middle" fill="#8A93A1">0.75</text><path d="M820.0 162V830" stroke="#2B323D" stroke-width="1"/><text x="820.0" y="156" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="12" text-anchor="middle" fill="#8A93A1">1</text><text x="40" y="176" font-family="Inter, 'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="600" fill="#8A93A1">Trained tasks, held-out test rows</text><text x="40" y="207" font-family="Inter, 'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="14.5" font-weight="600" fill="#E7EAEF">Banking77 intents</text><text x="40" y="225" font-family="Inter, 'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" fill="#C2C8D1">77 labels, 2,000 rows</text><rect x="300" y="198" width="286.0" height="12" rx="3" fill="#4A5361"/><text x="594.0" y="208.5" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="12.5" fill="#C2C8D1">0.550</text><rect x="300" y="214" width="482.6" height="12" rx="3" fill="#34D399"/><text x="790.56" y="224.5" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="12.5" font-weight="600" fill="#E7EAEF">0.928</text><rect x="856" y="200" width="64" height="22" rx="11" fill="#10261E"/><text x="888" y="215.5" font-fam