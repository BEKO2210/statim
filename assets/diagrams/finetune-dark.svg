<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 816" width="960" height="816" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" style="font-variant-numeric: tabular-nums">
<title id="t">Fine-tuning results: Banking77 accuracy up 37.7 points, held-out suites flat</title>
<desc id="d">Slope chart of accuracy (axis 0.4 to 1.0) on the first 2,000 test rows per suite, across four models: multilingual (base), + option budget 512, v1: fine-tuned, v3: + distillation. Banking77, the fine-tuning target: 0.4885, 0.5175, 0.8435, 0.8655. Held-out suites, never trained on: Emotion 0.532, 0.532, 0.502, 0.528; AG News 0.938, 0.938, 0.941, 0.9385. v1 dips 3.0 points on Emotion; v3 adds distillation and is back to 0.528 (base 0.532), so at v3 both held-out suites are within 0.5 points of base. Banking77 expected calibration error (ECE, lower is better): 0.372, 0.352, 0.052, 0.043.</desc>
