<svg xmlns="http://www.w3.org/2000/svg" width="960" height="496" viewBox="0 0 960 496" role="img" aria-labelledby="gpu-light-title gpu-light-desc">
  <title id="gpu-light-title">GPU (Vulkan): RTX 3070 vs. Ryzen 7 5800X, same model, same answers</title>
  <desc id="gpu-light-desc">Horizontal bar chart comparing Statim on an NVIDIA RTX 3070 GPU (Vulkan) with an AMD Ryzen 7 5800X CPU on the same machine, f32 weights, 30 x 8 golden workload, HTTP with 1 client. Throughput in requests per second: multilingual checkpoint CPU 2.68, GPU 20.5 (7.7x); English checkpoint CPU 0.91, GPU 8.1 (8.9x). Median latency p50 in milliseconds: multilingual CPU 353, GPU 45; English CPU 1,039, GPU 119. Parity against Laya on GPU: max absolute logit delta 8.8e-5 multilingual and 1.6e-4 English, argmax identical 240 of 240.</desc>
  <rect x="0" y="0" width="960" height="496" rx="16" fill="#F6F7F9"/>
  <g aria-hidden="true">
    <path d="M41 44H50.5" stroke="#161B22" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="57" cy="36" r="2.2" fill="none" stroke="#6B7482" stroke-width="1.25"/>
    <circle cx="57" cy="44" r="4" fill="#0F9F6E"/>
    <circle cx="57" cy="52" r="2.2" fill="none" stroke="#6B7482" stroke-width="1.25"/>
  </g>
  <text x="73" y="48.5" font-family="Inter, 'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="500" fill="#3A4350">GPU backend (Vulkan)</text>
  <text x="40" y="88" font-family="Inter, 'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="600" fill="#161B22">RTX 3070 vs. Ryzen 7 5800X: same model, same answers</text>
  <text x="40" y="116" font-family="Inter, 'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#3A4350">Same machine, f32 weights, 30 × 8 golden workload, HTTP with 1 client.</text>
  <text x="232" y="160" font-family="Inter, 'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600" fill="#161B22">Throughput</text>
  <text x="232" y="180" font-family="Inter, 'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" fill="#3A4350">requests/s, higher is better</text>
  <text x="648" y="160" font-family="Inter, 'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600" fill="#161B22">Median latency (p50)</text>
  <text x="648" y="180" font-family="Inter, 'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" fill="#3A4350">milliseconds, lower is better</text>
