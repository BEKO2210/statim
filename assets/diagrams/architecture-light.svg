<svg xmlns="http://www.w3.org/2000/svg" width="960" height="696" viewBox="0 0 960 696" role="img" aria-labelledby="architecture-light-title architecture-light-desc" font-family="Inter, 'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif">
<title id="architecture-light-title">How a request becomes a decision in Statim</title>
<desc id="architecture-light-desc">Flow diagram. A JSON request with state and questions goes to the prompt builder, which is byte-exact with laya.common.build_sequence, then to the native BPE tokenizer, identical to Hugging Face on 3,906 cases. The token sequence is [CLS], type token, question, [SEP], then one [MASK] token per option (billing, technical, sales, other), [SEP], state, [SEP]. Every token enters a ModernBERT / mmBERT encoder, a ggml graph that runs on CPU or a Vulkan GPU, with RoPE, alternating global / sliding-window attention, GeGLU and flash attention. The hidden state at each [MASK] goes through a type embedding and a 2-layer decision head, a scorer gives one score per option, and a temperature-calibrated softmax turns the scores into a calibrated probability per option. The chosen option, billing with probability 0.97 in this example, is returned as JSON. One forward pass covers all questions and options.</desc>
<rect x="0" y="0" width="960" height="696" rx="16" fill="#F6F7F9"/>
<text x="32" y="48" font-size="20" font-weight="600" fill="#161B22">How a request becomes a decision</text>
<text x="32" y="72" font-size="14" fill="#3A4350">One forward pass for all questions and options. Example: the department question with four options.</text>
