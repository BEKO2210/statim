<svg xmlns="http://www.w3.org/2000/svg" width="960" height="952" viewBox="0 0 960 952" role="img" aria-labelledby="results-0.4.0-dark-title results-0.4.0-dark-desc"><title id="results-0.4.0-dark-title">Statim 0.4.0: licence-clean model vs. base checkpoint</title><desc id="results-0.4.0-dark-desc">Accuracy of the base multilingual checkpoint and the Statim 0.4.0 model on Banking77 intents: 0.517 to 0.903; MASSIVE intents: 0.340 to 0.772; Typed decisions: 0.351 to 0.758; GoEmotions: 0.453 to 0.467; SIB-200 topic: 0.748 to 0.722; HateCheck: 0.630 to 0.647; IndoNLI: 0.740 to 0.700; FarsTail: 0.687 to 0.633; AG News: 0.938 to 0.931; DAIR Emotion: 0.532 to 0.526; SemRel: 0.213 to 0.227; Belebele: 0.247 to 0.310; HWU64 intents: 0.500 to 0.820.</desc><rect x="0" y="0" width="960" height="952" rx="16" fill="#12151B"/><g aria-hidden="true"><path d="M41 44H50.5" stroke="#E7EAEF" stroke-width="2.5" stroke-linecap="round"/><circle cx="57" cy="36" r="2.2" fill="none" stroke="#8A93A1" stroke-width="1.25"/><circle cx="57" cy="44" r="4" fill="#34D399"/><circle cx="57" cy="52" r="2.2" fill="none" stroke="#8A93A1" stroke-width="1.25"/></g><text x="73" y="48.5" font-family="Inter, 'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="500" fill="#C2C8D1">Release 0.4.0</text><text x="40" y="88" font-family="Inter, 'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="600" fill="#E7EAEF">Better on every trained task, no significant loss where it never trained</text><text x="40" y="114" font-family="Inter, 'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#C2C8D1">Held-out test rows and zero-shot suites, seeded samples; the model never saw these rows.</text><path d="M300.0 162V878" stroke="#2B323D" stroke-width="1"/><text x="300" y="156" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="12" text-anchor="middle" fill="#8A93A1">0</tex