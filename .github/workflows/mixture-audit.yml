name: mixture-audit
# Content audit of the mixture v6 adapters on a small sample of every enabled source
# (tools/finetune/mixture_v6/audit.py), plus the offline adapter tests. Runs when the adapters or
# the source registry change, weekly (upstream datasets change under a fixed revision name), and
# on demand.
on:
  push:
    paths:
      - "bench/eval_categories.py"
      - "bench/test_eval_categories.py"
      - "tools/finetune/gate.py"
      - "tools/finetune/test_gate.py"
      - "tools/finetune/train_lora.py"
      - "tools/finetune/lora_experiment.py"
      - "tools/finetune/test_train_lora.py"
      - "tools/finetune/build_mixture.py"
      - "tools/finetune/build_extra.py"
      - "tools/finetune/build_v9.py"
      - "tools/finetune/check_sources.py"
      - "tools/finetune/test_check_sources.py"
      - "tools/finetune/licence_audit.json"
      - "tools/finetune/mixture_v6/**"
      - "tools/finetune/sources/**"
      - ".github/workflows/mixture-audit.yml"
  pull_request:
    paths:
      - "bench/eval_categories.py"
      - "bench/test_eval_categories.py"
      - "tools/finetune/gate.py"
      - "tools/finetune/test_gate.py"
      - "tools/finetune/train_lora.py"
      - "tools/finetune/lora_experiment.py"
      - "tools/finetune/test_train_lora.py"
      - "tools/finetune/build_mixture.py"
      - "tools/finetune/build_extra.py"
      - "tools/finetune/build_v9.py"
      - "tools/finetune/check_sources.py"
      - "tools/finetune/test_check_sources.py"
      - "tools/finetune/licence_audit.json"
      - "tools/finetune/mixture_v6/**"
      - "tools/finetune/sources/**"
      - ".github/workflows/mixture-audit.yml"
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - run: pip install pytest pyarrow
      - run: python -m pytest -q tools/finetune/mixture_v6/test_adapters.py tools/finetune/mixture_v6/test_label_fixes.py tools/finetune/test_gate.py tools/finetune/test_train_lora.py bench/test_eval_categories.py tools/finetune/test_check_sources.py
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      STATIM_V6_MAX_SHARDS: "1"
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - run: pip install datasets huggingface_hub pyarrow
      - name: Cache Hub downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/huggingface
            data/raw
          key: mixture-audit-${{ hashFiles('tools/finetune/sources/v6-keep.json') }}
          restore-keys: mixture-audit-
      - name: Audit every enabled source (200 rows each)
        run: python tools/finetune/mixture_v6/audit.py --rows 200 --out audit/mixture-v6-audit.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: mixture-v6-audit
          path: audit/mixture-v6-audit.json
