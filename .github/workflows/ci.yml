name: ci
on:
  push:
  pull_request:
  schedule:
    - cron: '0 6 * * *'

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: recursive
      - name: Docs agree with the code (links, paths, flags, API, metrics, published numbers, versions)
        run: python3 tools/docs/test_check_docs.py && python3 tools/release/test_hf_publish_adapter.py && python3 tools/release/test_check_hardening.py && python3 tools/release/test_sbom.py && python3 tools/ci/test_fail_on_skip.py && python3 tools/ci/test_parity_summary.py && python3 tools/docs/check_docs.py
      - name: Toolchain
        run: sudo apt-get update && sudo apt-get install -y ninja-build && pip install --user --require-hashes -r requirements-ci.txt
      - name: API v1 contract compatibility
        run: python3 tools/docs/test_api_contract.py && python3 tools/docs/api_contract.py --check
      - name: Cache models
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: models
          key: laya-models-v2
      - name: Fetch + convert Laya checkpoints
        run: tools/fetch_models.sh multilingual english
      - name: Build (portable x86-64-v3)
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DSTATIM_NATIVE=OFF -DPython3_EXECUTABLE="$(command -v python3)"
          cmake --build build
      - name: Check hardening of release binaries
        run: python3 tools/release/check_hardening.py build/statim build/statim-quantize
      - name: Parity gates vs. the official Laya package
        env:
          STATIM_CONTRACT_REQUIRED: "1"  # the API contract test must run in CI, never skip
        run: |
          set -o pipefail  # without it a failing ctest would be hidden behind tee
          ctest --test-dir build --output-on-failure -E lora --output-junit "$PWD/ctest-main.xml" | tee ctest-main.log
          python3 tools/ci/fail_on_skip.py ctest-main.log  # a skipped suite (exit 77) must not pass CI
      - name: LoRA gates (verbose, so the measured differences stay in the log)
        run: |
          set -o pipefail  # without it a failing ctest would be hidden behind tee
          ctest --test-dir build -R lora -V --output-junit "$PWD/ctest-lora.xml" | tee ctest-lora.log
          python3 tools/ci/fail_on_skip.py ctest-lora.log
      - name: Record the measured parity of this run
        run: python3 tools/ci/parity_summary.py ctest-main.xml ctest-lora.xml --json parity.json --markdown "$GITHUB_STEP_SUMMARY"
      - name: Archive the parity record
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: parity-${{ github.sha }}-${{ github.event_name }}
          path: parity.json
          retention-days: 90
  sanitize:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: recursive
      - name: Toolchain
        run: sudo apt-get update && sudo apt-get install -y ninja-build clang-18 libclang-rt-18-dev && pip install --user --require-hashes -r requirements-ci.txt
      - name: Cache models
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: models
          key: laya-models-v2
      - name: Fetch + convert Laya checkpoints
        run: tools/fetch_models.sh multilingual english
      - name: Build (ASan + UBSan)
        run: |
          cmake -S . -B build-sanitize -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DSTATIM_NATIVE=OFF \
            -DCMAKE_C_COMPILER=clang-18 -DCMAKE_CXX_COMPILER=clang++-18 -DSTATIM_SANITIZE=ON \
            -DPython3_EXECUTABLE="$(command -v python3)"
          cmake --build build-sanitize
      - name: Memory safety and deterministic security suites (ASan + UBSan)
        env:
          CUDA_VISIBLE_DEVICES: ""
          STATIM_CONTRACT_REQUIRED: "1"
          ASAN_OPTIONS: "detect_leaks=1:abort_on_error=1:strict_string_checks=1:detect_stack_use_after_return=1"
          UBSAN_OPTIONS: "print_stacktrace=1:halt_on_error=1"
        run: |
          set -o pipefail  # without it a failing ctest would be hidden behind tee
          ctest --test-dir build-sanitize --output-on-failure --timeout 600 \
            -R '^(security|security_model|model_validation|gguf_preflight|tokenizer|cpu_check|security_http|api_contract|server_microbatch|server_lifecycle|fuzz_regressions_.*|model_parity_multilingual|engine_parity_multilingual|sgemm)$' \
            | tee ctest-sanitize.log
          python3 tools/ci/fail_on_skip.py ctest-sanitize.log
  tsan:
    runs-on: ubuntu-24.04
    timeout-minutes: 60  # server_lifecycle alone takes ~12 min under TSan locally; CI runners are slower
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: recursive
      - name: Toolchain
        run: sudo apt-get update && sudo apt-get install -y ninja-build clang-18 libclang-rt-18-dev && pip install --user --require-hashes -r requirements-ci.txt
      - name: Cache models
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: models
          key: laya-models-v2
      - name: Fetch + convert Laya checkpoints
        run: tools/fetch_models.sh multilingual english
      - name: Build (ThreadSanitizer)
        run: |
          cmake -S . -B build-tsan -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DSTATIM_NATIVE=OFF \
            -DCMAKE_C_COMPILER=clang-18 -DCMAKE_CXX_COMPILER=clang++-18 -DSTATIM_TSAN=ON \
            -DPython3_EXECUTABLE="$(command -v python3)"
          cmake --build build-tsan
      - name: Concurrency stress and thread safety suites (TSan)
        env:
          CUDA_VISIBLE_DEVICES: ""
          STATIM_LIFECYCLE_SIGTERM_RUNS: "1"  # five runs at TSan speed exceed the test's limit; ASan and release run five
          TSAN_OPTIONS: "halt_on_error=1:second_deadlock_stack=1"
        run: |
          set -o pipefail
          ctest --test-dir build-tsan --output-on-failure --timeout 1500 \
            -R '^(server_concurrency|sgemm|server_microbatch|server_lifecycle)$' \
            | tee ctest-tsan.log
          python3 tools/ci/fail_on_skip.py ctest-tsan.log
  android-arm64:
    # Cross-compiles every target for Android arm64 (NEON + dotprod) with the runner's NDK, so an
    # x86-only construct cannot break the ARM build again. No device here: the test run on real
    # hardware is recorded in the README's platform-support table.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: recursive
      - name: Toolchain
        run: sudo apt-get update && sudo apt-get install -y ninja-build
      - name: Build (Android arm64, NDK from the runner image)
        run: |
          echo "NDK: $ANDROID_NDK_LATEST_HOME"
          cmake -S . -B build-android -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_LATEST_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-29 -DSTATIM_NATIVE=OFF \
            -DGGML_CPU_ARM_ARCH=armv8.2-a+dotprod+fp16 -DGGML_OPENMP=OFF
          cmake --build build-android
          file build-android/statim | grep -q 'ARM aarch64'
      - name: Check hardening of Android binaries
        run: |
          python3 tools/release/check_hardening.py \
            --readelf "$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf" \
            build-android/statim
  fuzz:
    # 60 s per libFuzzer harness under ASan + UBSan, from the committed seeds and regressions plus the
    # corpus grown in earlier runs (actions/cache; fuzz/README.md).
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: recursive
      - name: Toolchain
        run: sudo apt-get update && sudo apt-get install -y ninja-build clang-18 libclang-rt-18-dev
      - name: Cache Laya tokenizers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            models/laya/tokenizer
            models/laya-multilingual/tokenizer
          key: laya-tokenizers-v1
      - name: Fetch Laya tokenizers (fuzz_tokenizer also runs on the real vocabularies)
        run: |
          for spec in \
            laya:laya:55cf4c4ebb4ebe31b2550e8bdf3bd21b99753851:6c8aaa9a542084f2457eab775d4eeb51f92a70c0fd9de28d5edb0ddec3c08d30 \
            laya-multilingual:laya-multilingual:e4e9ddf21a7b1903b7acffd8814ad4307bf63a67:609d8f4c067cd3950f88594c5a802616cea245823836ef5848ee4fc40aab5b6f; do
            IFS=: read -r repo name revision sha256 <<< "$spec"
            dir=models/$name/tokenizer; file=$dir/tokenizer.json; mkdir -p "$dir"
            if ! [ -s "$file" ] || ! printf '%s  %s\n' "$sha256" "$file" | sha256sum -c - >/dev/null; then
              curl -fL --retry 3 -o "$file" \
                "https://huggingface.co/convaiinnovations/$repo/resolve/$revision/tokenizer/tokenizer.json"
            fi
            printf '%s  %s\n' "$sha256" "$file" | sha256sum -c -
          done
      - name: Restore the grown fuzz corpus
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build-fuzz/corpus-*
          key: fuzz-corpus-${{ github.run_id }}
          restore-keys: fuzz-corpus-
      - name: Build fuzzers
        run: |
          cmake -S . -B build-fuzz -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DSTATIM_NATIVE=OFF \
            -DCMAKE_C_COMPILER=clang-18 -DCMAKE_CXX_COMPILER=clang++-18 -DSTATIM_FUZZ=ON
          cmake --build build-fuzz --target fuzz_request fuzz_tokenizer fuzz_gguf
      - name: fuzz_request (60 s)
        run: fuzz/run.sh request 60 build-fuzz
      - name: fuzz_tokenizer (60 s)
        if: success() || failure()
        run: fuzz/run.sh tokenizer 60 build-fuzz
      - name: fuzz_gguf (60 s)
        if: success() || failure()
        run: fuzz/run.sh gguf 60 build-fuzz
      - name: Upload crash inputs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzz-artifacts
          path: build-fuzz/artifacts/
          if-no-files-found: ignore
  vendored-cves:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: recursive
      - name: Self-test vendored CVE tooling
        run: python3 tools/security/test_vendored_cves.py
      - name: Verify vendored header pins
        run: python3 tools/security/test_check_vendored.py && python3 tools/security/check_vendored.py
      - name: Live control step (OSV database coverage check)
        run: python3 tools/security/vendored_cves.py --control
      - name: Check vendored CVEs
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 tools/security/vendored_cves.py
  nginx:
    # Host binary, not the image. Measured 2026-10-02 on this 16-core machine:
    # cmake --target statim 24.4 s; test_nginx.sh 2.3 s (q8, page cache warm).
    # docker build -f Dockerfile was 30.5 s with the apt layer already cached
    # (the compile step was 27.6 s and also builds quantize and the healthcheck).
    # This workflow does not cache that image, so the job builds statim on the
    # runner and the script runs it on the host network. 20 min covers a 4-vCPU
    # runner and a cold fetch of the checkpoints (~1.4 GB of safetensors).
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: recursive
      - name: Toolchain
        run: sudo apt-get update && sudo apt-get install -y ninja-build && pip install --user --require-hashes -r requirements-ci.txt
      - name: Cache models
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: models
          key: laya-models-v2
      - name: Fetch + convert Laya checkpoints
        run: tools/fetch_models.sh multilingual english
      - name: Build statim
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DSTATIM_NATIVE=OFF -DSTATIM_BUILD_TESTS=OFF
          cmake --build build --target statim
      - name: NGINX configuration
        run: deploy/nginx/test_nginx.sh
  sdk:
    # Both official SDKs, hermetic and live, against three started servers: no key, a bearer key,
    # and a test LoRA adapter (READINESS P1 #37). A skipped live case fails the job.
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: recursive
      - name: Toolchain
        run: |
          sudo apt-get update && sudo apt-get install -y ninja-build
          pip install --user --require-hashes -r requirements-ci.txt -r clients/python/requirements-test.txt
          node --version && npm --version
      - name: Cache models
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: models
          key: laya-models-v2
      - name: Fetch + convert Laya checkpoints
        run: tools/fetch_models.sh multilingual english
      - name: Build statim
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DSTATIM_NATIVE=OFF -DSTATIM_BUILD_TESTS=OFF
          cmake --build build --target statim
      - name: Test LoRA adapter
        run: python3 tests/lora/build_fixtures.py --base models/laya-multilingual-f32.gguf --out build/lora
      - name: TypeScript SDK dependencies (lockfile)
        working-directory: clients/js
        run: npm ci
      - name: SDK suites against live servers
        run: clients/run_live_tests.sh build/statim models/laya-multilingual-f32.gguf build/lora/random.gguf
  alerts:
    # deploy/prometheus: promtool checks the alert rules and runs their unit tests (READINESS P1 #29).
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      PROMETHEUS_VERSION: 3.15.0
      # sha256 of prometheus-3.15.0.linux-amd64.tar.gz, from the release's sha256sums.txt
      PROMETHEUS_SHA256: 2a542df32eac02ee17b9d844fb2aa1de00dafa5476579ba8a3ba862e9d572ea0
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: promtool (pinned, hash-checked)
        run: |
          f=prometheus-$PROMETHEUS_VERSION.linux-amd64.tar.gz
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/$f" "https://github.com/prometheus/prometheus/releases/download/v$PROMETHEUS_VERSION/$f"
          echo "$PROMETHEUS_SHA256  $RUNNER_TEMP/$f" | sha256sum -c
          tar xzf "$RUNNER_TEMP/$f" -C "$RUNNER_TEMP" --strip-components=1 "prometheus-$PROMETHEUS_VERSION.linux-amd64/promtool"
      - name: Alert rules and their unit tests
        run: PROMTOOL="$RUNNER_TEMP/promtool" deploy/prometheus/test_alerts.sh
  secrets:
    # gitleaks over the commits a push or pull request adds; the daily run scans all history
    # (READINESS P1 #18). Push protection on GitHub is the first line; this catches what it misses.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      GITLEAKS_VERSION: 8.30.1
      # sha256 of gitleaks_8.30.1_linux_x64.tar.gz, from the release's checksums.txt
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: gitleaks (pinned, hash-checked)
        run: |
          f=gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/$f" "https://github.com/gitleaks/gitleaks/releases/download/v$GITLEAKS_VERSION/$f"
          echo "$GITLEAKS_SHA256  $RUNNER_TEMP/$f" | sha256sum -c
          tar xzf "$RUNNER_TEMP/$f" -C "$RUNNER_TEMP" gitleaks
      - name: Scan the new commits
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          if [ "$EVENT" = pull_request ]; then range="$PR_BASE..HEAD"
          elif [ "$EVENT" = push ] && [ -n "$PUSH_BEFORE" ] && [ "${PUSH_BEFORE#0000000}" = "$PUSH_BEFORE" ] \
               && git cat-file -e "$PUSH_BEFORE^{commit}" 2>/dev/null; then range="$PUSH_BEFORE..HEAD"
          elif [ "$EVENT" = push ] && [ "$GITHUB_REF" != refs/heads/main ]; then range="origin/main..HEAD"
          else range="HEAD"  # schedule, or a push without a usable base: all history
          fi
          echo "scanning $range"
          "$RUNNER_TEMP/gitleaks" git --redact --no-banner --config .gitleaks.toml --log-opts="$range" .
