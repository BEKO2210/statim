name: release

# Runs when a release is published (the release notes are written by hand), builds the binaries
# from the release tag and attaches them to that release.
on:
  release:
    types: [published]
  # Dry run of the build job (archives as workflow artifacts, nothing is published).
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.flavor }} archive
    runs-on: ubuntu-24.04
    # manylinux_2_28 (AlmaLinux 8, glibc 2.28): the binaries run on glibc 2.28 and newer
    # (READINESS P1 #55); tools/release/build_manylinux.sh pins the compiler.
    container: quay.io/pypa/manylinux_2_28_x86_64@sha256:1e102f2e9ed9b7fd8d64b29f798c76078c3fa8f14d34914d7a4045e39419d8e0
    strategy:
      fail-fast: false
      matrix:
        include:
          - flavor: cpu
            vulkan: "OFF"
          - flavor: vulkan
            vulkan: "ON"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: recursive

      - name: Use Python 3.12 and trust the checkout
        run: |
          echo /opt/python/cp312-cp312/bin >> "$GITHUB_PATH"
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Cache glslc (shaderc v2023.8)
        if: matrix.vulkan == 'ON'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /opt/shaderc-v2023.8
          key: shaderc-e6edd6d48fa5bdd9d176794c6810fae7f8e938e1-spirv-headers-manylinux_2_28

      - name: Build portable binaries
        run: tools/release/build_manylinux.sh "${{ matrix.flavor }}" "build-${{ matrix.flavor }}" -DSTATIM_BUILD_TESTS=OFF

      - name: Package release archive
        run: |
          export SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          tools/package_release.sh "build-${{ matrix.flavor }}" "${{ matrix.flavor }}" "${GITHUB_REF_NAME}" dist

      - name: Check hardening of archived binaries
        run: python3 tools/release/check_hardening.py --max-glibc 2.28 dist/*.tar.gz

      - name: Generate SBOM for release archive
        run: |
          export SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          for archive in dist/*.tar.gz; do
            python3 tools/release/sbom.py --archive "$archive" --source . \
              --out "${archive%.tar.gz}.spdx.json"
          done

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: statim-${{ matrix.flavor }}
          path: |
            dist/*.tar.gz
            dist/*.spdx.json
          if-no-files-found: error

  gpu-parity:
    # CUDA and Vulkan parity gates on the self-hosted RTX 3070 for the tagged commit; publish waits
    # for them, so the Vulkan archive is never uploaded untested (READINESS P1 #43).
    if: github.event_name == 'release'
    uses: ./.github/workflows/gpu.yml

  publish:
    name: Publish GitHub release assets
    needs: [build, gpu-parity]
    if: github.event_name == 'release'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true

      - name: Create checksums
        working-directory: dist
        run: sha256sum -- *.tar.gz > SHA256SUMS

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.tar.gz

      - name: Create release if needed and upload assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}  # the publish job has no checkout, so gh needs the repo explicitly
          TAG: ${{ github.event.release.tag_name }}
        run: |
          gh release upload "$TAG" dist/*.tar.gz dist/SHA256SUMS dist/*.spdx.json --clobber
