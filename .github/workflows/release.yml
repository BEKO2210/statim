name: release

# Runs when a release is published (the release notes are written by hand), builds the binaries
# from the release tag and attaches them to that release.
on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.flavor }} archive
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - flavor: cpu
            vulkan: "OFF"
          - flavor: vulkan
            vulkan: "ON"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: recursive

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake g++ ninja-build
          if [[ "${{ matrix.vulkan }}" == "ON" ]]; then
            sudo apt-get install -y --no-install-recommends libvulkan-dev glslc spirv-headers
          fi

      - name: Build portable binaries
        run: |
          cmake -S . -B "build-${{ matrix.flavor }}" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DSTATIM_NATIVE=OFF \
            -DSTATIM_BUILD_TESTS=OFF \
            -DSTATIM_VULKAN=${{ matrix.vulkan }} \
            -DCMAKE_EXE_LINKER_FLAGS="-static-libstdc++ -static-libgcc"
          cmake --build "build-${{ matrix.flavor }}" --target statim statim-quantize

      - name: Package release archive
        run: |
          export SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          tools/package_release.sh "build-${{ matrix.flavor }}" "${{ matrix.flavor }}" "${GITHUB_REF_NAME}" dist

      - name: Check hardening of archived binaries
        run: python3 tools/release/check_hardening.py dist/*.tar.gz

      - name: Generate SBOM for release archive
        run: |
          export SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          for archive in dist/*.tar.gz; do
            python3 tools/release/sbom.py --archive "$archive" --source . \
              --out "${archive%.tar.gz}.spdx.json"
          done

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: statim-${{ matrix.flavor }}
          path: |
            dist/*.tar.gz
            dist/*.spdx.json
          if-no-files-found: error

  publish:
    name: Publish GitHub release assets
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true

      - name: Create checksums
        working-directory: dist
        run: sha256sum -- *.tar.gz > SHA256SUMS

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.tar.gz

      - name: Create release if needed and upload assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}  # the publish job has no checkout, so gh needs the repo explicitly
          TAG: ${{ github.event.release.tag_name }}
        run: |
          gh release upload "$TAG" dist/*.tar.gz dist/SHA256SUMS dist/*.spdx.json --clobber
