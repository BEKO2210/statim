            X-Request-Id:
              description: Echoed client value, or 16 generated hexadecimal characters.
              schema:
                type: string
        '401':
          description: Keys are configured and Authorization is missing or is not 'Bearer ' plus one of
            those keys.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                unauthorized:
                  value:
                    detail: invalid or missing bearer token
                  x-live: false
        '413':
          description: A body, JSON-structure, field, count, aggregate work/token/attention, or response-size
            limit failed. Defaults are 2 MiB body, depth 64, 100000 nodes, 1024 members/object, 4096-byte
            keys, 4096 work rows, 1048576 aggregate tokens, 1024 MiB estimated attention, and 16777216
            response bytes. See docs/API.md for formulas and configurable flags.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                tooManyQuestions:
                  value:
                    detail: too many questions
                tooManyOptions:
                  value:
                    detail: too many choice options for 'q' (101 > 100)
                tooManyLevels:
                  value:
                    detail: too many score levels for 'q' (33 > 32)
                tooManyTotal:
                  value:
                    detail: too many answer options across questions (540 > 512)
                stateTooLarge:
                  value:
                    detail: state too large (50001 > 50000 chars)
                bodyTooLarge:
                  value:
                    detail: request body exceeds 2 MiB
                jsonDepth:
                  value:
                    detail: JSON nesting too deep
                jsonNodes:
                  value:
                    detail: too many JSON nodes
                objectMembers:
                  value:
                    detail: too many JSON object members
                jsonKey:
                  value:
                    detail: JSON key exceeds 4096 bytes
                work:
                  value:
                    detail: request exceeds state/question/view work limit
                tokens:
                  value:
                    detail: request exceeds aggregate token budget
                attention:
                  value:
                    detail: request exceeds attention memory budget
                responseEstimate:
                  value:
                    detail: request exceeds response byte budget
                responseFinal:
                  value:
                    detail: response exceeds byte budget
          headers:
            X-Request-Id:
              description: Echoed client value, or 16 generated hexadecimal characters.
              schema:
                type: string
        '422':
          description: model/lang/adapter field validation; unknown adapter; min_confidence validation (0..1); strict integer validation
            of ensemble (1..8), max_len, or head_max_len (32..8192); effective sequence capacity; question
            validation; option-marker budget; expiry of the cooperative inference deadline; or client
            disconnection while this request waits in a micro-batch (--batch-window-ms). Explicit
            /v1/systemone/batch calls are never micro-batched, so that case does not apply there.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                noulLabels:
                  value:
                    detail: 'question ''q'': noul labels must map exactly ''false'' and ''true'' to distinct
                      non-empty strings'
                maxLenLow:
                  value:
                    detail: max_len must be an integer between 32 and 8192
                maxLenHigh:
                  value:
                    detail: max_len must be an integer between 32 and 8192
                headLenFloat:
                  value:
                    detail: head_max_len must be an integer between 32 and 8192
                ensemble:
                  value:
                    detail: ensemble must be an integer between 1 and 8
                minConfidence:
                  value:
                    detail: min_confidence must be a number from 0 to 1
                capacity:
                  value:
                    detail: effective max_len exceeds model capacity (head_max_len needs 128 state tokens)
                inferenceDeadline:
                  value:
                    detail: inference deadline exceeded
                inferenceCancelled:
                  summary: Client disconnected while queued in a micro-batch (--batch-window-ms)
                  value:
                    detail: inference cancelled
                  x-live: false
                badType:
                  value:
                    detail: unknown question type; use choice, score, noul or yes_no
                noInstructions:
                  value:
                    detail: question requires instructions
                choiceEmpty:
                  value:
                    detail: 'question ''q'': a choice question needs at least one criterion'
                choiceString:
                  value:
                    detail: 'question ''q'': a choice question takes ''criteria'' as a dict of label ->
                      description, or a list of labels'
                choiceNested:
                  value:
                    detail: 'question ''q'': choice label 0 must be a scalar (a string, number or null)'
                scoreObject:
                  value:
                    detail: 'question ''q'': a score question takes ''criteria'' as a list of level descriptions,
                      index 0 first'
                scoreEmpty:
                  value:
                    detail: 'question ''q'': a score question needs at least one level'
                scoreNull:
                  value:
                    detail: 'question ''q'': score level 1 is null; give every level a description'
                noulList:
                  value:
                    detail: 'question ''q'': a noul question takes ''criteria'' as a dict with optional
                      ''true''/''false'' descriptions, or omits it'
                noulKey:
                  value:
                    detail: 'question ''q'': a noul question takes ''criteria'' keyed only ''true''/''false'''
                labelsOnChoice:
                  value:
                    detail: 'question ''q'': ''labels'' is only supported for noul questions'
                headBudget:
                  value:
                    detail: question 'q' options exceed head_max_len=32
          headers:
            X-Request-Id:
              description: Echoed client value, or 16 generated hexadecimal characters.
              schema:
                type: string
        '500':
          description: The handler caught an unexpected exception. The client receives this fixed string.
            The process log contains the exception text.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                inferenceFailed:
