openapi: 3.1.0
info:
  title: Statim HTTP API
  version: 0.2.0
  description: 'HTTP API of the Statim decision server. Samples were captured from a binary whose GET
    /health version is 0.2.0. See docs/API.md for the narrative guide. JSON error bodies are objects with
    a single string field, detail. A body over 2 MiB is HTTP 413 with an empty body and no X-Request-Id.
    GET /ready returns 503 {"ready": false} when the concurrency cap is full, without Retry-After. 401
    and 500 bodies are produced by the handler when a key is configured or an unexpected exception is
    thrown. The server that produced the live samples had no API key and did not throw, so those two bodies
    are the handler strings rather than captured responses.'
  license:
    name: Apache-2.0
servers:
- url: http://127.0.0.1:8080
  description: Default listen address (--host 127.0.0.1 --port 8080).
tags:
- name: decisions
  description: Typed decisions.
- name: operations
  description: Health, models, metrics, playground.
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Required only when STATIM_API_KEY or --api-key-file configures at least one key. The
        header must be exactly 'Bearer ' followed by one configured key. Health, ready, metrics, and the
        playground never require it.
  parameters:
    RequestId:
      name: X-Request-Id
      in: header
      required: false
      schema:
        type: string
      description: Echoed on handler responses. If omitted, the server generates 16 hexadecimal characters.
  schemas:
    Error:
      type: object
      additionalProperties: false
      required:
      - detail
      properties:
        detail:
          type: string
    Action:
      type: object
      additionalProperties: false
      required:
      - act_probability
      properties:
        act_probability:
          type: number
    Usage:
      type: object
      additionalProperties: false
      required:
      - input_tokens
      - output_tokens
      properties:
        input_tokens:
          type: integer
          minimum: 0
        output_tokens:
          type: integer
          const: 0
    Routing:
      type: object
      additionalProperties: false
      required:
      - model
      - reason
      - engine
      - weights
      properties:
        model:
          type: string
        reason:
          type: string
          enum:
          - requested
          - lang:en
          - lang:other
          - default
          - consensus
        engine:
          type: string
          const: statim
        weights:
          type: string
    ChoiceAnswer:
      type: object
      required:
      - type
      - choice
      - probabilities
      - confidence
      - answer_confidence
      - action
      properties:
        type:
          const: choice
        choice:
          oneOf:
          - type: string
          - type: number
          - type: boolean
          - type: 'null'
        probabilities:
          type: object
          additionalProperties:
            type: number
        confidence: &id001
          type: number
        answer_confidence: &id002
          type: number
        action: &id003
          $ref: '#/components/schemas/Action'
        logits: &id004
          type: array
          items:
            type: number
        logits_by_model: &id005
          type: object
          additionalProperties:
            type: array
            items:
              type: number
    ScoreAnswer:
      type: object
      required:
      - type
      - score
      - legend
      - probabilities
      - confidence
      - answer_confidence
      - action
      properties:
        type:
          const: score
        score:
          type: number
        legend:
          type: object
          additionalProperties: true
        probabilities:
          type: object
          additionalProperties:
            type: number
        confidence: *id001
        answer_confidence: *id002
        action: *id003
        logits: *id004
        logits_by_model: *id005
    NoulAnswer:
      type: object
      required:
      - type
      - noul
      - confidence
      - answer_confidence
      - action
      properties:
        type:
          const: noul
        noul:
          type: number
        confidence: *id001
        answer_confidence: *id002
        action: *id003
        logits: *id004
        logits_by_model: *id005
    Decision:
      type: object
      additionalProperties: false
      required:
      - model
      - answers
      - usage
      - routing
      properties:
        model:
          type: string
        answers:
          type: object
          additionalProperties:
            oneOf:
            - $ref: '#/components/schemas/ChoiceAnswer'
            - $ref: '#/components/schemas/ScoreAnswer'
            - $ref: '#/components/schemas/NoulAnswer'
        usage:
          $ref: '#/components/schemas/Usage'
        routing:
          $ref: '#/components/schemas/Routing'
    Question:
      type: object
      required:
      - type
      - instructions
      properties:
        type:
          type: string
          enum:
          - choice
          - score
          - noul
        instructions:
          description: Text the model answers. A non-string is serialized as JSON.
        criteria:
          description: 'Choice: object of label to description, or a list of scalars. Score: list of level
            descriptions. Noul: optional object keyed true and false.'
        labels:
          type: object
          description: Noul only. Maps false and true to distinct non-empty strings.
          properties:
            'true':
              type: string
            'false':
              type: string
    SystemOneRequest:
      type: object
      required:
      - state
      - questions
      properties:
        state:
          description: Any JSON value except null.
        questions:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/Question'
        model:
          type: string
        lang:
          type: string
        ensemble:
          type: integer
          description: Clamped to 1..8. Non-integers are ignored.
        ensemble_margin:
          type: number
          description: Clamped to 0..1. Non-numbers are ignored.
        calibrate:
          type: boolean
        return_logits:
          type: boolean
        max_len:
          type: integer
          minimum: 32
          maximum: 8192
        head_max_len:
          type: integer
          minimum: 32
          maximum: 8192
    BatchRequest:
      type: object
      required:
      - states
      - questions
      properties:
        states:
          type: array
          maxItems: 256
          items:
            description: Same values as state.
        questions:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/Question'
        model:
          type: string
        lang:
          type: string
        ensemble:
          type: integer
        ensemble_margin:
          type: number
        calibrate:
          type: boolean
        return_logits:
          type: boolean
        max_len:
          type: integer
          minimum: 32
          maximum: 8192
        head_max_len:
          type: integer
          minimum: 32
          maximum: 8192
    BatchResponse:
      type: object
      additionalProperties: false
      required:
      - results
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/Decision'
    Health:
      type: object
      additionalProperties: false
      required:
      - status
      - engine
      - version
      - loaded
      - device
      properties:
        status:
          const: ok
        engine:
          const: statim
        version:
          type: string
        loaded:
          type: array
          items:
            type: string
        device:
          type: string
    Ready:
      type: object
      additionalProperties: false
      required:
      - ready
      properties:
        ready:
          type: boolean
    Model:
      type: object
      additionalProperties: false
      required:
      - id
      - object
      - owned_by
      - source
      - weights
      - layers
      - hidden
      - max_len
      - vocab
      properties:
        id:
          type: string
        object:
          const: model
        owned_by:
          const: statim
        source:
          type: string
        weights:
          type: string
        layers:
          type: integer
        hidden:
          type: integer
        max_len:
          type: integer
        vocab:
          type: integer
    ModelList:
      type: object
      additionalProperties: false
      required:
      - object
      - data
      properties:
        object:
          const: list
        data:
          type: array
          items:
            $ref: '#/components/schemas/Model'
paths:
  /v1/systemone:
    post:
      tags:
      - decisions
      summary: Score one state.
      description: Runs every question against one state. model, lang, ensemble, ensemble_margin, calibrate,
        return_logits, max_len, and head_max_len are optional. See docs/API.md.
      operationId: decide
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SystemOneRequest'
            examples:
              invoice:
                summary: Choice, score, and noul on one English state
                value:
                  state: &id006
                    subject: 'Duplicate charge on invoice #4411'
                    body: We were billed twice for March. Please refund the duplicate today or we will
                      cancel.
                  questions: &id007
                    department:
                      type: choice
                      instructions: Which department should handle this request?
                      criteria:
                        billing: invoices, payments, refunds
                        technical: bugs, outages
                        sales: pricing, new contracts
                        other: everything else
                    urgency:
                      type: score
                      instructions: How urgent is this request?
                      criteria:
                      - not urgent
                      - soon
                      - critical deadline or blocking issue
                    refund:
                      type: noul
                      instructions: Does the user explicitly request a refund?
                x-expect-status: 200
              choiceList:
                summary: Choice criteria as a list of labels
                value:
                  state: The app crashes when I open settings.
                  model: english
                  questions:
                    topic:
                      type: choice
                      instructions: Topic?
                      criteria:
                      - billing
                      - technical
                      - other
                x-expect-status: 200
              scalarLabels:
                summary: Numeric and null choice labels
                value:
                  state: Pick 2.
                  model: english
                  questions:
                    n:
                      type: choice
                      instructions: Which number is named?
                      criteria:
                      - 1
                      - 2
                      - null
                x-expect-status: 200
              noulCustom:
                summary: Noul with labels and criteria
                value:
                  state: Please refund the duplicate charge.
                  model: english
                  questions:
                    refund:
                      type: noul
                      instructions: Does the user explicitly request a refund?
                      criteria:
                        'true': the user asks for money back
                        'false': no refund is requested
                      labels:
                        'true': 'yes'
                        'false': 'no'
                x-expect-status: 200
              noulLabels:
                summary: Noul labels are not distinct
                value:
                  state: x
                  questions:
                    q:
                      type: noul
                      instructions: x
                      labels:
                        'false': 'no'
                        'true': 'no'
                x-expect-status: 422
              emptyQuestions:
                summary: No questions
                value:
                  state: hello
                  questions: {}
                x-expect-status: 200
              german:
                summary: Automatic route to the multilingual checkpoint
                value:
                  state: Die Rechnung wurde doppelt belastet. Bitte erstatten Sie den Betrag noch heute.
                  questions:
                    refund:
                      type: noul
                      instructions: Does the user explicitly request a refund?
                x-expect-status: 200
              consensus:
                summary: Equal-weight consensus of both checkpoints
                value:
                  state: *id006
                  questions: *id007
                  model: consensus
                x-expect-status: 200
              consensusLogits:
                summary: Consensus with logits_by_model
                value:
                  state: Please refund the duplicate charge today.
                  model: consensus
                  return_logits: true
                  questions: &id008
                    refund:
                      type: noul
                      instructions: Does the user explicitly request a refund?
                x-expect-status: 200
              returnLogits:
                summary: Raw logits on one checkpoint
                value:
                  state: Please refund the duplicate charge today.
                  model: english
                  return_logits: true
                  questions: *id008
                x-expect-status: 200
              ensemble1:
                summary: Single option order
                value:
                  state: I was charged twice and also the site is down.
                  model: english
                  questions: &id009
                    topic:
                      type: choice
                      instructions: What is this about?
                      criteria:
                        billing: payments and refunds
                        technical: bugs and outages
                        other: anything else
                  ensemble: 1
                  ensemble_margin: 1
                x-expect-status: 200
              ensemble3:
                summary: Three cyclic option orders
                value:
                  state: I was charged twice and also the site is down.
                  model: english
                  questions: *id009
                  ensemble: 3
                  ensemble_margin: 1
                x-expect-status: 200
              clampedEnsemble:
                summary: Out-of-range ensemble is clamped, bad types ignored
                value:
                  state: hi there
                  questions: {}
                  ensemble: 99
                  ensemble_margin: 5
                  calibrate: 'yes'
                x-expect-status: 200
              calibrateOff:
                summary: Choice without calibration
                value:
                  state: Please refund the duplicate charge today.
                  model: english
                  questions: &id010
                    topic:
                      type: choice
                      instructions: What is this about?
                      criteria:
                        billing: payments and refunds
                        technical: bugs and outages
                  calibrate: false
                x-expect-status: 200
              calibrateOn:
                summary: Choice with contextual calibration
                value:
                  state: Please refund the duplicate charge today.
                  model: english
                  questions: *id010
                  calibrate: true
                x-expect-status: 200
              invalidJson:
                summary: Body is not JSON
                description: Send this text as the raw body. It is not a JSON object.
                value: not json
                x-expect-status: 400
              jsonArray:
                summary: JSON array
                description: Send this text as the raw body. It is not a JSON object.
                value: '[1,2]'
                x-expect-status: 400
              missingQuestions:
                summary: No questions field
                value:
                  state: x
                x-expect-status: 400
              missingState:
                summary: No state
                value:
                  questions: {}
                x-expect-status: 400
              nullState:
                summary: Null state
                value:
                  state: null
                  questions: {}
                x-expect-status: 400
              questionsNotObject:
                summary: Questions is a list
                value:
                  state: x
                  questions: []
                x-expect-status: 400
              maxLenLow:
                summary: max_len below 32
                value:
                  state: x
                  questions: {}
                  max_len: 31
                x-expect-status: 422
              maxLenHigh:
                summary: max_len above 8192
                value:
                  state: x
                  questions: {}
                  max_len: 8193
                x-expect-status: 422
              headLenFloat:
                summary: head_max_len is not an integer
                value:
                  state: x
                  questions: {}
                  head_max_len: 32.5
                x-expect-status: 422
              badType:
                summary: Unknown question type
                value:
                  state: x
                  questions:
                    q:
                      type: rank
                      instructions: x
                x-expect-status: 422
              noInstructions:
                summary: Missing instructions
                value:
                  state: x
                  questions:
                    q:
                      type: noul
                x-expect-status: 422
              notObject:
                summary: Question is not an object
                value:
                  state: x
                  questions:
                    q: noul
                x-expect-status: 422
              choiceEmpty:
                summary: Choice with no criteria
                value:
                  state: x
                  questions:
                    q:
                      type: choice
                      instructions: x
                      criteria: {}
                x-expect-status: 422
              choiceString:
                summary: Choice criteria is a string
                value:
                  state: x
                  questions:
                    q:
                      type: choice
                      instructions: x
                      criteria: a, b
                x-expect-status: 422
              choiceNested:
                summary: Choice label is an object
                value:
                  state: x
                  questions:
                    q:
                      type: choice
                      instructions: x
                      criteria:
                      - a: 1
                x-expect-status: 422
              scoreObject:
                summary: Score criteria is an object
                value:
                  state: x
                  questions:
                    q:
                      type: score
                      instructions: x
                      criteria:
                        a: b
                x-expect-status: 422
              scoreEmpty:
