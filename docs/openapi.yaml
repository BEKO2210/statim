openapi: 3.1.0
info:
  title: Statim HTTP API
  version: 0.9.3
  description: 'HTTP API of the Statim decision server. See docs/API.md for the narrative guide and
    complete limit formulas. JSON error bodies are objects with a single string field, detail. GET /ready
    instead returns 503 {"ready": false} when the concurrency cap is full, without Retry-After. Unknown
    top-level request fields and question-definition fields are ignored for laya.serve compatibility;
    duplicate JSON object keys are rejected.'
  license:
    name: Apache-2.0
servers:
- url: http://127.0.0.1:8080
  description: Default listen address (--host 127.0.0.1 --port 8080).
x-server-configuration:
  authentication:
    env: STATIM_API_KEY=key1,key2
    flag: --api-key-file FILE (repeatable; one key per line)
    behavior: Each explicitly configured source must independently yield a valid key or startup aborts.
      Keys are trimmed 32-4096 byte printable ASCII strings without whitespace. With no source configured,
      only loopback listeners start unless --allow-unauthenticated is passed; that explicit opt-in logs
      auth_off_on_network and records auth=false and auth_status=off.
  environment:
    STATIM_DEVICE: Default compute device.
    STATIM_GPU_FAST: Set to 1 for --gpu-fast.
    STATIM_LOG: Set to debug to retain ggml debug logging.
  limits:
    --max-json-depth: 64 (hard maximum 128)
    --max-json-nodes: 100000
    --max-object-members: 1024
    --max-request-work: 4096
    --max-request-tokens: 1048576
    --max-attention-mib: 1024
    --max-response-bytes: 16777216
    --max-concurrent: 16 (valid range 1-256)
    --workers: 1 (valid range 1-64)
    --http-queue: 32
    --request-timeout: 30 seconds, absolute header plus body deadline
    --inference-timeout: 120 seconds from admission through queue and inference
    --max-len: 0 selects checkpoint default; nonzero values must be 32-8192 and fit model capacity
    --head-max-len: 0 selects checkpoint default; nonzero values must be 32-8192
    --ensemble: 1 (valid range 1-8)
    --min-confidence: unset (number 0-1; 0 disables selective prediction)
    --batch-window-ms: 0 (off; a positive window packs compatible POST /v1/systemone calls into shared forward passes)
    --max-batch: 16 states per server-created micro-batch
  other-flags:
  - -m [name=]model.gguf (repeatable)
  - --host
  - --port
  - --device
  - --gpu-fast
  - --threads
  - --calibrate
  - --consensus
  - --no-access-log
  - --no-playground
  - --allow-unauthenticated
  - --adapter [model:]name=adapter.gguf (repeatable; see docs/API.md, LoRA adapters)
  - --adapter-mode merge|runtime
x-request-limits:
  body-bytes: 2097152
  json-depth: 64 (configurable with --max-json-depth; hard ceiling 128)
  json-nodes: 100000 (configurable with --max-json-nodes)
  object-members: 1024 per object (configurable with --max-object-members)
  json-key-bytes: 4096
  duplicate-object-keys: rejected with 400
  unknown-request-and-question-fields: ignored
  batch-states: 256
  questions: 64
  state-codepoints: 50000 after Python-compatible serialization when structured
  choice-options: 100 per question
  score-levels: 32 per question
  choice-plus-score-options: 512 per request
  question-id-bytes: 256
  model-and-lang-bytes: 256
  instructions-rendered-bytes: 16384
  object-label-key-bytes: 1024
  criterion-or-label-rendered-bytes: 4096
  max_len-and-head_max_len: Strict integers 32-8192. Effective length is max(max_len, head_max_len + 128)
    and must fit every selected model.
  ensemble: Strict integer 1-8.
  aggregate-work: Default 4096 states x question views x models; includes ensemble views, three
    calibration views per choice, and consensus models.
  aggregate-tokens: Default 1048576 work rows x effective sequence length.
  attention-bytes: Default 1073741824; estimate is 2 x min(32 x length, 8192) x length x
    max(encoder_heads, head_heads) x 4.
  response-bytes: Default 16777216, enforced by a conservative preflight estimate and final serialization.
  inference-deadline-seconds: 120 from admission by default; expiry in inference is 422 and expiry in
    the worker queue is 503.
tags:
- name: decisions
  description: Typed decisions.
- name: operations
  description: Health, models, metrics, playground.
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Required only when STATIM_API_KEY or --api-key-file configures at least one key. The
        header must be exactly 'Bearer ' followed by one configured key. Decision endpoints, metrics,
        and models require it; health, ready, and the playground remain public. Explicitly configured
        empty, invalid, missing, or unreadable key sources abort startup.
  parameters:
    RequestId:
      name: X-Request-Id
      in: header
      required: false
      schema:
        type: string
      description: Echoed on handler responses when it is 1-128 ASCII letters, digits, dot, underscore,
        or hyphen. An absent or invalid value is replaced with 16 generated hexadecimal characters.
  schemas:
    Error:
      type: object
      additionalProperties: false
      required:
      - detail
      properties:
        detail:
          type: string
    Action:
      type: object
      additionalProperties: false
      required:
      - act_probability
      properties:
        act_probability:
          type: number
    Usage:
      type: object
      additionalProperties: false
      required:
      - input_tokens
      - output_tokens
      properties:
        input_tokens:
          type: integer
          minimum: 0
        output_tokens:
          type: integer
          const: 0
    Routing:
      type: object
      additionalProperties: false
      required:
      - model
      - reason
      - engine
      - weights
      properties:
        model:
          type: string
        reason:
          type: string
          enum:
          - requested
          - lang:en
          - lang:other
          - default
          - consensus
          - adapter
        engine:
          type: string
          const: statim
        weights:
          type: string
        adapter:
          type:
          - string
          - 'null'
          description: LoRA adapter that ran, null for the base weights. Present only when the server has
            adapters loaded or the request sets adapter.
        adapter_reason:
          type: string
          description: none, requested, auto:<family>, auto:<family>:no-adapter, auto:no-family or auto:consensus.
            Present together with adapter.
    ChoiceAnswer:
      type: object
      required:
      - type
      - choice
      - probabilities
      - confidence
      - answer_confidence
      - action
      properties:
        type:
          const: choice
        choice:
          oneOf:
          - type: string
          - type: number
          - type: boolean
          - type: 'null'
        probabilities:
          type: object
          additionalProperties:
            type: number
        confidence: &id001
          type: number
        answer_confidence: &id002
          type: number
        escalate: &escalate
          type: boolean
          description: Present only when a positive min_confidence threshold applies; true when answer_confidence
            is below that threshold.
        action: &id003
          $ref: '#/components/schemas/Action'
        logits: &id004
          type: array
          items:
            type: number
        logits_by_model: &id005
          type: object
          additionalProperties:
            type: array
            items:
              type: number
    ScoreAnswer:
      type: object
      required:
      - type
      - score
      - legend
      - probabilities
      - confidence
      - answer_confidence
      - action
      properties:
        type:
          const: score
        score:
          type: number
        legend:
          type: object
          additionalProperties: true
        probabilities:
          type: object
          additionalProperties:
            type: number
        confidence: *id001
        answer_confidence: *id002
        escalate: *escalate
        action: *id003
        logits: *id004
        logits_by_model: *id005
    NoulAnswer:
      type: object
      required:
      - type
      - noul
      - confidence
      - answer_confidence
      - action
      properties:
        type:
          const: noul
        noul:
          type: number
        confidence: *id001
        answer_confidence: *id002
        escalate: *escalate
        action: *id003
        logits: *id004
        logits_by_model: *id005
    Decision:
      type: object
      additionalProperties: false
      required:
      - model
      - answers
      - usage
      - routing
      properties:
        model:
          type: string
        answers:
          type: object
          additionalProperties:
            oneOf:
            - $ref: '#/components/schemas/ChoiceAnswer'
            - $ref: '#/components/schemas/ScoreAnswer'
            - $ref: '#/components/schemas/NoulAnswer'
        usage:
          $ref: '#/components/schemas/Usage'
        routing:
          $ref: '#/components/schemas/Routing'
    Question:
      type: object
      description: Unknown properties are ignored.
      required:
      - type
      - instructions
      properties:
        type:
          type: string
          enum:
          - choice
          - score
          - noul
          - yes_no
        instructions:
          description: Text the model answers. A non-string is serialized as JSON.
          x-max-rendered-bytes: 16384
        criteria:
          description: 'Choice: object of label to description, or a list of scalars. Score: list of level
            descriptions. Noul: optional object keyed true and false.'
        labels:
          type: object
          description: Noul and its yes_no request alias only. Maps false and true to distinct non-empty strings.
          properties:
            'true':
              type: string
            'false':
              type: string
    SystemOneRequest:
      type: object
      description: Unknown properties are ignored for laya.serve compatibility.
      required:
      - state
      - questions
      properties:
        state:
          description: Any JSON value except null.
          not:
            type: 'null'
        questions:
          type: object
          maxProperties: 64
          propertyNames:
            x-maxBytes: 256
          additionalProperties:
            $ref: '#/components/schemas/Question'
        model:
          type: string
          x-maxBytes: 256
        adapter:
          type:
          - string
          - 'null'
          x-maxBytes: 256
          description: null or "none" (base weights), "auto" (by question family), or the name of a LoRA
            adapter loaded for the selected model (--adapter). See docs/API.md, LoRA adapters.
        lang:
          type: string
          x-maxBytes: 256
        ensemble:
          type: integer
          minimum: 1
          maximum: 8
          description: Strict integer range; invalid present values return 422.
        ensemble_margin:
          description: Numbers are clamped to 0..1; any other JSON type is accepted and ignored.
        calibrate:
          description: A boolean override; any other JSON type is accepted and ignored.
        return_logits:
          description: A boolean override; any other JSON type is accepted and ignored.
        min_confidence:
          type: number
          minimum: 0
          maximum: 1
          description: Overrides --min-confidence. Zero disables selective prediction for this request;
            invalid present values return 422.
        max_len:
          type: integer
          minimum: 32
          maximum: 8192
        head_max_len:
          type: integer
          minimum: 32
          maximum: 8192
    BatchRequest:
      type: object
      description: Unknown properties are ignored for laya.serve compatibility.
      required:
      - states
      - questions
      properties:
        states:
          type: array
          maxItems: 256
          items:
            description: Same values as state.
            not:
              type: 'null'
        questions:
          type: object
          maxProperties: 64
          propertyNames:
            x-maxBytes: 256
          additionalProperties:
            $ref: '#/components/schemas/Question'
        model:
          type: string
          x-maxBytes: 256
        adapter:
          type:
          - string
          - 'null'
          x-maxBytes: 256
          description: null or "none" (base weights), "auto" (by question family), or the name of a LoRA
            adapter loaded for the selected model (--adapter). See docs/API.md, LoRA adapters.
        lang:
          type: string
          x-maxBytes: 256
        ensemble:
          type: integer
          minimum: 1
          maximum: 8
          description: Strict integer range; invalid present values return 422.
        ensemble_margin:
          description: Numbers are clamped to 0..1; any other JSON type is accepted and ignored.
        calibrate:
          description: A boolean override; any other JSON type is accepted and ignored.
        return_logits:
          description: A boolean override; any other JSON type is accepted and ignored.
        min_confidence:
          type: number
          minimum: 0
          maximum: 1
          description: Overrides --min-confidence. Zero disables selective prediction for this request;
            invalid present values return 422.
        max_len:
          type: integer
          minimum: 32
          maximum: 8192
        head_max_len:
          type: integer
          minimum: 32
          maximum: 8192
    BatchResponse:
      type: object
      additionalProperties: false
      required:
      - results
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/Decision'
    Health:
      type: object
      additionalProperties: false
      required:
      - status
      - version
      properties:
        status:
          const: ok
        version:
          type: string
    Ready:
      type: object
      additionalProperties: false
      required:
      - ready
      properties:
        ready:
          type: boolean
    Model:
      type: object
      additionalProperties: false
      required:
      - id
      - object
      - owned_by
      - source
      - weights
      - layers
      - hidden
      - max_len
      - vocab
      - device
      - fingerprint
      - checkpoint_sha256
      properties:
        id:
          type: string
        object:
          const: model
        owned_by:
          const: statim
        source:
          type: string
        weights:
          type: string
        layers:
          type: integer
        hidden:
          type: integer
        max_len:
          type: integer
        vocab:
          type: integer
        device:
          type: string
        fingerprint:
          type: string
          pattern: ^[0-9a-f]{64}$
          description: SHA-256 fingerprint of the checkpoint vectors.
        checkpoint_sha256:
          type:
          - string
          - 'null'
          pattern: ^[0-9a-f]{64}$
          description: Full source-checkpoint tensor hash, or null for older GGUF files without it.
        adapters:
          type: array
          description: Present only when the server was started with --adapter.
          items:
            $ref: '#/components/schemas/Adapter'
    Adapter:
      type: object
      additionalProperties: false
      required:
      - id
      - source
      - mode
      - rank
      - alpha
      - pairs
      - pairs_applied
      - categories
      - bytes
      properties:
        id:
          type: string
        source:
          type: string
        mode:
          type: string
          enum:
          - merge
          - runtime
        rank:
          type: integer
        alpha:
          type: number
        pairs:
          type: integer
        pairs_applied:
          type: integer
        categories:
          type: array
          items:
            type: string
        bytes:
          type: integer
    ModelList:
      type: object
      additionalProperties: false
      required:
      - object
      - data
      properties:
        object:
          const: list
        data:
          type: array
          items:
            $ref: '#/components/schemas/Model'
  responses:
    NoRequestBody:
      description: This endpoint received a nonempty Content-Length body or any Transfer-Encoding body,
        or the request had ambiguous/invalid body framing. Framing checks run before authentication.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            detail: this endpoint does not accept a request body
    BodyTooLarge:
      description: Declared Content-Length exceeds 2097152 bytes. Checked before authentication or routing.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            detail: request body exceeds 2 MiB
paths:
  /v1/systemone:
    post:
      tags:
      - decisions
      summary: Score one state.
      description: Runs every question against one state. model, adapter, lang, ensemble, ensemble_margin, calibrate,
        return_logits, min_confidence, max_len, and head_max_len are optional. See docs/API.md.
      operationId: decide
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SystemOneRequest'
            examples:
              invoice:
                summary: Choice, score, and noul on one English state
                value:
                  state: &id006
                    subject: 'Duplicate charge on invoice #4411'
                    body: We were billed twice for March. Please refund the duplicate today or we will
                      cancel.
                  questions: &id007
                    department:
                      type: choice
                      instructions: Which department should handle this request?
                      criteria:
                        billing: invoices, payments, refunds
                        technical: bugs, outages
                        sales: pricing, new contracts
                        other: everything else
                    urgency:
                      type: score
                      instructions: How urgent is this request?
                      criteria:
                      - not urgent
                      - soon
                      - critical deadline or blocking issue
                    refund:
                      type: noul
                      instructions: Does the user explicitly request a refund?
                x-expect-status: 200
              choiceList:
                summary: Choice criteria as a list of labels
                value:
                  state: The app crashes when I open settings.
                  model: english
                  questions:
                    topic:
                      type: choice
                      instructions: Topic?
                      criteria:
                      - billing
                      - technical
                      - other
                x-expect-status: 200
              scalarLabels:
                summary: Numeric and null choice labels
                value:
                  state: Pick 2.
                  model: english
                  questions:
                    n:
                      type: choice
                      instructions: Which number is named?
                      criteria:
                      - 1
                      - 2
                      - null
                x-expect-status: 200
              noulCustom:
                summary: Noul with labels and criteria
                value:
                  state: Please refund the duplicate charge.
                  model: english
                  questions:
                    refund:
                      type: noul
                      instructions: Does the user explicitly request a refund?
                      criteria:
                        'true': the user asks for money back
                        'false': no refund is requested
                      labels:
                        'true': 'yes'
                        'false': 'no'
                x-expect-status: 200
              noulLabels:
                summary: Noul labels are not distinct
                value:
                  state: x
                  questions:
                    q:
                      type: noul
                      instructions: x
                      labels:
                        'false': 'no'
                        'true': 'no'
                x-expect-status: 422
              emptyQuestions:
                summary: No questions
                value:
                  state: hello
                  questions: {}
                x-expect-status: 200
              german:
                summary: Automatic route to the multilingual checkpoint
                value:
                  state: Die Rechnung wurde doppelt belastet. Bitte erstatten Sie den Betrag noch heute.
                  questions:
                    refund:
                      type: noul
                      instructions: Does the user explicitly request a refund?
                x-expect-status: 200
              consensus:
                summary: Equal-weight consensus of both checkpoints
                value:
                  state: *id006
                  questions: *id007
                  model: consensus
                x-expect-status: 200
              consensusLogits:
                summary: Consensus with logits_by_model
                value:
                  state: Please refund the duplicate charge today.
                  model: consensus
                  return_logits: true
                  questions: &id008
                    refund:
                      type: noul
                      instructions: Does the user explicitly request a refund?
                x-expect-status: 200
              returnLogits:
                summary: Raw logits on one checkpoint
                value:
                  state: Please refund the duplicate charge today.
                  model: english
                  return_logits: true
                  questions: *id008
                x-expect-status: 200
              ensemble1:
                summary: Single option order
                value:
                  state: I was charged twice and also the site is down.
                  model: english
                  questions: &id009
                    topic:
                      type: choice
                      instructions: What is this about?
                      criteria:
                        billing: payments and refunds
                        technical: bugs and outages
                        other: anything else
                  ensemble: 1
                  ensemble_margin: 1
                x-expect-status: 200
              ensemble3:
                summary: Three cyclic option orders
                value:
                  state: I was charged twice and also the site is down.
                  model: english
                  questions: *id009
                  ensemble: 3
                  ensemble_margin: 1
                x-expect-status: 200
              maxEnsemble:
                summary: Largest valid ensemble; non-boolean calibrate is ignored
                value:
                  state: hi there
                  questions: {}
                  ensemble: 8
                  ensemble_margin: 5
                  calibrate: 'yes'
                x-expect-status: 200
              calibrateOff:
                summary: Choice without calibration
                value:
                  state: Please refund the duplicate charge today.
                  model: english
                  questions: &id010
                    topic:
                      type: choice
                      instructions: What is this about?
                      criteria:
                        billing: payments and refunds
                        technical: bugs and outages
                  calibrate: false
                x-expect-status: 200
              calibrateOn:
                summary: Choice with contextual calibration
                value:
                  state: Please refund the duplicate charge today.
                  model: english
                  questions: *id010
                  calibrate: true
                x-expect-status: 200
              invalidJson:
                summary: Body is not JSON
                description: Send this text as the raw body. It is not a JSON object.
                value: not json
                x-expect-status: 400
              jsonArray:
                summary: JSON array
                description: Send this text as the raw body. It is not a JSON object.
                value: '[1,2]'
                x-expect-status: 400
              missingQuestions:
                summary: No questions field
                value:
                  state: x
                x-expect-status: 400
              missingState:
                summary: No state
                value:
                  questions: {}
                x-expect-status: 400
              nullState:
                summary: Null state
                value:
                  state: null
                  questions: {}
                x-expect-status: 400
              questionsNotObject:
                summary: Questions is a list
                value:
                  state: x
                  questions: []
                x-expect-status: 400
              maxLenLow:
                summary: max_len below 32
                value:
                  state: x
                  questions: {}
                  max_len: 31
                x-expect-status: 422
              maxLenHigh:
                summary: max_len above 8192
                value:
                  state: x
                  questions: {}
                  max_len: 8193
                x-expect-status: 422
              headLenFloat:
                summary: head_max_len is not an integer
                value:
                  state: x
                  questions: {}
                  head_max_len: 32.5
                x-expect-status: 422
              badType:
                summary: Unknown question type
                value:
                  state: x
                  questions:
                    q:
                      type: rank
                      instructions: x
                x-expect-status: 422
              noInstructions:
                summary: Missing instructions
                value:
                  state: x
                  questions:
                    q:
                      type: noul
                x-expect-status: 422
              notObject:
                summary: Question is not an object
                value:
                  state: x
                  questions:
                    q: noul
                x-expect-status: 400
              choiceEmpty:
                summary: Choice with no criteria
                value:
                  state: x
                  questions:
                    q:
                      type: choice
                      instructions: x
                      criteria: {}
                x-expect-status: 422
              choiceString:
                summary: Choice criteria is a string
                value:
                  state: x
                  questions:
                    q:
                      type: choice
                      instructions: x
                      criteria: a, b
                x-expect-status: 422
              choiceNested:
                summary: Choice label is an object
                value:
                  state: x
                  questions:
                    q:
                      type: choice
                      instructions: x
                      criteria:
                      - a: 1
                x-expect-status: 422
              scoreObject:
                summary: Score criteria is an object
                value:
                  state: x
                  questions:
                    q:
                      type: score
                      instructions: x
                      criteria:
                        a: b
                x-expect-status: 422
              scoreEmpty:
                summary: Score with no levels
                value:
                  state: x
                  questions:
                    q:
                      type: score
                      instructions: x
                      criteria: []
                x-expect-status: 422
              scoreNull:
                summary: Null score level
                value:
                  state: x
                  questions:
                    q:
                      type: score
                      instructions: x
                      criteria:
                      - ok
                      - null
                x-expect-status: 422
              noulList:
                summary: Noul criteria is a list
                value:
                  state: x
                  questions:
                    q:
                      type: noul
                      instructions: x
                      criteria:
                      - maybe
                x-expect-status: 422
              noulKey:
                summary: Noul criteria key
                value:
                  state: x
                  questions:
                    q:
                      type: noul
                      instructions: x
                      criteria:
                        maybe: x
                x-expect-status: 422
              labelsOnChoice:
                summary: labels on a choice
                value:
                  state: x
                  questions:
                    q:
                      type: choice
                      instructions: x
                      criteria:
                      - a
                      labels:
                        'true': y
                        'false': n
                x-expect-status: 422
              tooManyQuestions:
                summary: tooManyQuestions
                value:
                  state: x
                  questions:
                    q0:
                      type: noul
                      instructions: x
                    q1:
                      type: noul
                      instructions: x
                    q2:
                      type: noul
                      instructions: x
                    q3:
                      type: noul
                      instructions: x
                    q4:
                      type: noul
                      instructions: x
                    q5:
                      type: noul
                      instructions: x
                    q6:
                      type: noul
                      instructions: x
                    q7:
                      type: noul
                      instructions: x
                    q8:
                      type: noul
                      instructions: x
                    q9:
                      type: noul
                      instructions: x
                    q10:
                      type: noul
                      instructions: x
