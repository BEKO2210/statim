                $ref: '#/components/schemas/Error'
              examples:
                tooManyQuestions:
                  value:
                    detail: too many questions (65 > 64)
                tooManyOptions:
                  value:
                    detail: too many choice options for 'q' (101 > 100)
                tooManyLevels:
                  value:
                    detail: too many score levels for 'q' (33 > 32)
                tooManyTotal:
                  value:
                    detail: too many answer options across questions (540 > 512)
                stateTooLarge:
                  value:
                    detail: state too large (50001 > 50000 chars)
          headers:
            X-Request-Id:
              description: Echoed client value, or 16 generated hexadecimal characters.
              schema:
                type: string
