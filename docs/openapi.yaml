                value:
                  state: x
                  questions:
                    q:
                      type: score
                      instructions: x
                      criteria:
                      - ok
                      - null
                x-expect-status: 422
              noulList:
                summary: Noul criteria is a list
                value:
                  state: x
                  questions:
                    q:
                      type: noul
                      instructions: x
                      criteria:
                      - maybe
                x-expect-status: 422
              noulKey:
