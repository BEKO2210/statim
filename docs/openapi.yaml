  /health:
    get:
      tags:
      - operations
      summary: Liveness.
      operationId: health
      responses:
        '200':
          description: The process is accepting connections.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
              examples:
                ok:
                  value:
                    status: ok
                    engine: statim
                    version: 0.2.0
                    loaded:
                    - english
                    - multilingual
                    device: cpu
  /ready:
    get:
      tags:
      - operations
      summary: Readiness.
      description: '200 when in_flight is below max_concurrent. 503 {"ready": false} when the cap is full.
        No Retry-After on this response.'
      operationId: ready
      responses:
        '200':
          description: Admission control has room.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ready'
              examples:
                ready:
                  value:
                    ready: true
        '503':
          description: in_flight is at max_concurrent. This body is not the decision-handler detail object.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ready'
              examples:
                saturated:
                  value:
                    ready: false
                  x-live: saturation
  /v1/models:
    get:
      tags:
      - operations
      summary: List loaded checkpoints.
      operationId: listModels
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Checkpoints in load order.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelList'
              examples:
                loaded:
                  value:
                    object: list
                    data:
                    - id: english
                      object: model
                      owned_by: statim
                      source: laya
                      weights: f32
                      layers: 28
                      hidden: 1024
                      max_len: 512
                      vocab: 50368
                    - id: multilingual
                      object: model
                      owned_by: statim
                      source: laya-multilingual
                      weights: f32
                      layers: 22
                      hidden: 768
                      max_len: 1024
                      vocab: 256000
        '401':
          description: Keys are configured and the bearer token does not match.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                unauthorized:
                  value:
                    detail: invalid or missing bearer token
                  x-live: false
  /metrics:
    get:
      tags:
      - operations
      summary: Prometheus metrics.
      operationId: metrics
      responses:
        '200':
          description: Prometheus exposition, version 0.0.4. Counter values change. See docs/API.md for
            each series.
          content:
            text/plain:
              schema:
                type: string
              example: '# HELP statim_requests_total Inference requests by HTTP status.

                # TYPE statim_requests_total counter

                # HELP statim_request_duration_ms End-to-end request latency.

                # TYPE statim_request_duration_ms histogram

                statim_request_duration_ms_bucket{le="5"} 0

                statim_request_duration_ms_bucket{le="+Inf"} 0

                statim_request_duration_ms_sum 0

                statim_request_duration_ms_count 0

                # TYPE statim_input_tokens_total counter

                statim_input_tokens_total 0

                # TYPE statim_rejected_busy_total counter

                statim_rejected_busy_total 0

                # TYPE statim_in_flight gauge

                statim_in_flight 0

                # TYPE statim_uptime_seconds gauge

                statim_uptime_seconds 0

                statim_workers_busy{model="english"} 0

                statim_model_info{model="english",weights="f32",version="0.2.0"} 1

                '
              x-verify: metrics
  /:
    get:
      tags:
      - operations
      summary: Playground, or 404 when disabled.
      operationId: playground
      responses:
        '200':
          description: The playground HTML document. Default. Content-Type is text/html; charset=utf-8.
            The document title is Statim Playground.
          content:
            text/html:
              schema:
                type: string
              example: '<!doctype html>

                <html lang="en">

                <head>

                <title>Statim Playground</title>'
              x-verify: playground
        '404':
          description: Returned for GET / when the server was started with --no-playground. Other unknown
            paths return 404 with an empty body instead.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                disabled:
                  value:
                    detail: not found
                  x-live: false
