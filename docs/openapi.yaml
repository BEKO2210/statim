                      non-empty strings'
                maxLenLow:
                  value:
                    detail: '''max_len'' must be an integer between 32 and 8192'
                maxLenHigh:
                  value:
                    detail: '''max_len'' must be an integer between 32 and 8192'
                headLenFloat:
                  value:
                    detail: '''head_max_len'' must be an integer between 32 and 8192'
                badType:
                  value:
                    detail: 'question ''q'': unknown type; use one of [''choice'', ''noul'', ''score'']'
                noInstructions:
                  value:
                    detail: 'question ''q'': no ''instructions''; add the text the model should answer'
                notObject:
                  value:
                    detail: 'question ''q'': definition must be an object'
                choiceEmpty:
                  value:
                    detail: 'question ''q'': a choice question needs at least one criterion'
                choiceString:
                  value:
                    detail: 'question ''q'': a choice question takes ''criteria'' as a dict of label ->
                      description, or a list of labels'
                choiceNested:
                  value:
                    detail: 'question ''q'': choice label 0 must be a scalar (a string, number or null)'
                scoreObject:
                  value:
                    detail: 'question ''q'': a score question takes ''criteria'' as a list of level descriptions,
                      index 0 first'
                scoreEmpty:
                  value:
                    detail: 'question ''q'': a score question needs at least one level'
                scoreNull:
                  value:
                    detail: 'question ''q'': score level 1 is null; give every level a description'
                noulList:
                  value:
                    detail: 'question ''q'': a noul question takes ''criteria'' as a dict with optional
                      ''true''/''false'' descriptions, or omits it'
                noulKey:
                  value:
                    detail: 'question ''q'': a noul question takes ''criteria'' keyed only ''true''/''false'''
                labelsOnChoice:
                  value:
                    detail: 'question ''q'': ''labels'' is only supported for noul questions'
                headBudget:
                  value:
                    detail: question 'q' options exceed head_max_len=32
          headers:
            X-Request-Id:
              description: Echoed client value, or 16 generated hexadecimal characters.
              schema:
                type: string
        '500':
          description: The handler caught an unexpected exception. The client receives this fixed string.
            The process log contains the exception text.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                inferenceFailed:
                  value:
                    detail: inference failed
                  x-live: false
          headers:
            X-Request-Id:
              description: Echoed client value, or 16 generated hexadecimal characters.
              schema:
                type: string
        '503':
          description: in_flight was already at max_concurrent (default 16). Retry-After is 1.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                busy:
                  value:
                    detail: server busy, try again later
                  x-live: saturation
          headers:
            X-Request-Id:
              description: Echoed client value, or 16 generated hexadecimal characters.
              schema:
                type: string
            Retry-After:
              description: Seconds to wait. The handler sets this to 1.
              schema:
                type: string
                const: '1'
