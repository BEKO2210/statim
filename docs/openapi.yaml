              description: Echoed client value, or 16 generated hexadecimal characters.
              schema:
                type: string
        '413':
          description: 'A count or size limit failed. A body larger than 2097152 bytes never reaches this
            JSON form: the HTTP stack returns 413 with an empty body and no X-Request-Id.'
          content:
