        '413':
          $ref: '#/components/responses/BodyTooLarge'
  /ready:
    get:
      tags:
      - operations
      summary: Readiness.
      description: '200 when in_flight is below max_concurrent. 503 {"ready": false} when the cap is full.
        No Retry-After on this response.'
      operationId: ready
      responses:
        '200':
          description: Admission control has room.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ready'
              examples:
                ready:
                  value:
                    ready: true
        '503':
          description: in_flight is at max_concurrent. This body is not the decision-handler detail object.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ready'
              examples:
                saturated:
                  value:
                    ready: false
                  x-live: saturation
        '400':
          $ref: '#/components/responses/NoRequestBody'
        '413':
          $ref: '#/components/responses/BodyTooLarge'
