                    detail: inference failed
                  x-live: false
          headers:
            X-Request-Id:
              description: Echoed client value, or 16 generated hexadecimal characters.
              schema:
                type: string
        '503':
          description: Admission is at max_concurrent (default 16), or the model-worker queue deadline
            expired. Retry-After is 1 only for admission saturation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
