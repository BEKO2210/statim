          content:
            text/html:
              schema:
                type: string
              example: '<!doctype html>

                <html lang="en">

                <head>

                <title>Statim Playground</title>'
              x-verify: playground
        '400':
          $ref: '#/components/responses/NoRequestBody'
        '413':
          $ref: '#/components/responses/BodyTooLarge'
        '404':
          description: Returned for GET / when the server was started with --no-playground. Other unknown
            paths and wrong methods return 404 with detail HTTP request failed (after bearer auth for
            nonpublic paths).
